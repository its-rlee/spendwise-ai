
name: SpendWise CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DATABASE_URL: sqlite+pysqlite:///./ci_bootstrap.db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_S3_BUCKET: ci-placeholder
      OLLAMA_URL: http://127.0.0.1:11434

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run backend tests
        run: python -m pytest -v

  flutter-tests:
    name: Flutter Tests and Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  repository-check:
    name: Check Tracked Secret Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Reject tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^mobile/config/dev\.json$|(^|/)\.aws/|\.pem$'; then
            echo "::error::Potential secret file is tracked."
            exit 1
          fi

  docker-build:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - flutter-tests
      - repository-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: spendwise-api:ci

      - name: Check Python in Docker
        run: |
          docker run --rm spendwise-api:ci python --version

      - name: Check Tesseract in Docker
        run: |
          docker run --rm spendwise-api:ci tesseract --version
