name: Android Debug Compilation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/lib/main.dart'
      - 'mobile/pubspec.yaml'
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compile debug APK without any secrets
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug \
            --dart-define=API_BASE_URL=http://127.0.0.1:8000 \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=test-publishable-key
          test -s build/app/outputs/flutter-apk/app-debug.apk
